[project]
name = "infrapilot"
version = "2.0.0"
description = "Infra Pilot CLI - CLI-first infrastructure orchestration platform"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.scripts]
ipilot = "ipilot.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ipilot*"]
