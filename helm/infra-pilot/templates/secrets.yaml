{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infra-pilot.secretName" . }}
  labels:
    {{- include "infra-pilot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* In production, fail fast if required keys are empty; allow empty defaults for helm template/lint and non-prod */}}
  {{- if eq .Values.global.environment "production" }}
  db-password: {{ required "secrets.data.DB_PASSWORD is required in production – provide via external secret or set secrets.data.DB_PASSWORD (prefer existingSecret)" .Values.secrets.data.DB_PASSWORD | b64enc | quote }}
  redis-password: {{ required "secrets.data.REDIS_PASSWORD is required in production – provide via external secret or set secrets.data.REDIS_PASSWORD" .Values.secrets.data.REDIS_PASSWORD | b64enc | quote }}
  api-key: {{ required "secrets.data.API_KEY is required in production – generate via: openssl rand -hex 32" .Values.secrets.data.API_KEY | b64enc | quote }}
  {{- else }}
  db-password: {{ .Values.secrets.data.DB_PASSWORD | b64enc | quote }}
  redis-password: {{ .Values.secrets.data.REDIS_PASSWORD | b64enc | quote }}
  api-key: {{ .Values.secrets.data.API_KEY | b64enc | quote }}
  {{- end }}
{{- end }}