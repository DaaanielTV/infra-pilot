[pytest]
testpaths = tests
markers =
  unit: Unit tests
  integration: Integration tests
  e2e: End-to-end tests using mocked providers
  smoke: Fast import and health checks
  asyncio: Async tests run via pytest-asyncio
addopts = --cov=vps_manager --cov=rbac --cov=secrets_manager --cov=rate_limiter --cov=config --cov=db --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=50
