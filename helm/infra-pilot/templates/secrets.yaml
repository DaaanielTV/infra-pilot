apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infra-pilot.fullname" . }}-secrets
  labels:
    {{- include "infra-pilot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.create }}
  db-password: {{ required "secrets.data.DB_PASSWORD is required – set via --set secrets.data.DB_PASSWORD or external secret" .Values.secrets.data.DB_PASSWORD | b64enc | quote }}
  redis-password: {{ required "secrets.data.REDIS_PASSWORD is required – set via --set secrets.data.REDIS_PASSWORD or external secret" .Values.secrets.data.REDIS_PASSWORD | b64enc | quote }}
  api-key: {{ required "secrets.data.API_KEY is required – generate via: openssl rand -hex 32" .Values.secrets.data.API_KEY | b64enc | quote }}
  {{- end }}